# Clean-room path: guarantees the prototype runs regardless of host machine.
# Native `make setup && make demo` remains the primary path; this is insurance.

services:
  orchestrator:
    build: .
    image: agentic-sdlc:latest
    command: orchestrator --help
    profiles: ["manual"]
    env_file: .env
    environment:
      - LLM_MODE=${LLM_MODE:-mock}   # runs offline by default
      - SOURCE_REPO_PATH=/source-repo
    volumes:
      - workspace:/app/workspace
      - ./target-app:/app/target-app
      - .:/source-repo:ro

  dashboard:
    image: agentic-sdlc:latest
    build: .
    command: dashboard
    env_file: .env
    environment:
      - SOURCE_REPO_PATH=/source-repo
    ports:
      - "8000:8000"                  # approvals + live metrics
    volumes:
      - workspace:/app/workspace
      - ./target-app:/app/target-app
      - .:/source-repo:ro

  target-app:
    image: agentic-sdlc:latest
    build: .
    command: uvicorn target-app.main:app --host 0.0.0.0 --port 8080
    ports:
      - "8080:8080"                  # the built URL shortener
    volumes:
      - ./target-app:/app/target-app

volumes:
  workspace:                         # shared: governance.db, runs, artifacts, audit logs, metrics
